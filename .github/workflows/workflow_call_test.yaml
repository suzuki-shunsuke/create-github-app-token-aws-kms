name: test (workflow_call)
permissions: {}
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: true
jobs:
  # Install npm packages once and share node_modules with the test-js and release jobs,
  # so they run in parallel against the same commit (the merge commit of the pull request)
  npm:
    uses: suzuki-shunsuke/download-npm-package-action/.github/workflows/download.yaml@356be7a431f3fe7ff4a3a61e3dedb3a571f954e7 # v0.0.3
    permissions:
      contents: read
      id-token: write
    with:
      ref: refs/pull/${{github.event.pull_request.number}}/merge
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  release:
    uses: suzuki-shunsuke/js-action-release-workflow/.github/workflows/release.yaml@42e36aaa98bac85ec0f17d929aede6c61faa2fff # v0.0.5
    needs: npm
    with:
      npm_artifact_name: node_modules
      ref: ${{needs.npm.outputs.sha}}
      version: pr/${{github.event.pull_request.number}}
      pr: ${{github.event.pull_request.number}}
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      contents: write
      pull-requests: write
      id-token: write

  # npm run lint and npm test
  test-js:
    uses: suzuki-shunsuke/js-action-test-workflow/.github/workflows/test.yaml@0f107d3b611b6139f139a3a9a3ecdafcb59b913e # v0.0.3
    needs: npm
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      contents: read
      id-token: write
    with:
      npm_artifact_name: node_modules
      ref: ${{needs.npm.outputs.sha}}

  test-workflow:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@51ece8dcaabff59820bfb2053c56e3cb281cf7b2 # v0.0.1
    with:
      aqua_version: v2.65.2
    permissions:
      contents: read
      pull-requests: read
